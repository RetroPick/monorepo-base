services:
  postgres:
    image: postgres:16
    container_name: retropick-postgres-prod
    restart: unless-stopped
    env_file:
      - ${RETROPICK_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - retropick_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: migrator
    container_name: retropick-migrator-prod
    restart: "no"
    env_file:
      - ${RETROPICK_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy

  markets-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: markets-api
    container_name: retropick-markets-api-prod
    restart: unless-stopped
    env_file:
      - ${RETROPICK_ENV_FILE:-.env.production}
    environment:
      DB_MAX_CONNS: ${API_DB_MAX_CONNS:-8}
      DB_MIN_CONNS: ${API_DB_MIN_CONNS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck", "/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: retropick-nginx-prod
    restart: unless-stopped
    depends_on:
      - markets-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
      APP_HOST: ${APP_HOST:-}
    volumes:
      - ./docker/nginx-production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/render-nginx-production.sh:/etc/nginx/render-production-conf.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    command: ["/bin/sh", "/etc/nginx/render-production-conf.sh"]

  web:
    profiles: ["full-vps"]
    build:
      context: .
      dockerfile: apps/fe-v1/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID}
    container_name: retropick-web-prod
    restart: unless-stopped
    depends_on:
      - markets-api
    expose:
      - "3000"

volumes:
  retropick_postgres:
