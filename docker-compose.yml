# Default DB URL: postgres:5432 (Compose DNS). For Docker Desktop bridge timeouts, use
# compose.desktop-hairpin.env. extra_hosts defines host.docker.internal where the engine
# does not (Linux Engine / WSL), so hairpin URLs resolve.

services:
  postgres:
    image: postgres:16
    container_name: retropick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retropick
      POSTGRES_PASSWORD: retropick
      POSTGRES_DB: retropick
    # Host 5433 avoids clashing with a local Postgres on 5432. Containers use the
    # service hostname `postgres` on port 5432 (Compose network), not the host publish port.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retropick -d retropick"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: api
    container_name: retropick-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}
      RPC_URL: https://sepolia.base.org
      CORS_STRICT: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      WS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      LIVE_RPC_TIMEOUT: 15s
      LIVE_RPC_GLOBAL_CACHE_TTL: 5s
      DB_MAX_CONNS: "16"
      DB_MIN_CONNS: "2"
      DB_HEALTH_CHECK_INTERVAL: 30s
      # Abstraction layer funding config (Base Sepolia defaults)
      SETTLEMENT_CHAIN_ID: "84532"
      SETTLEMENT_USDC_ADDRESS: "<base_sepolia_usdc_address>"
      SETTLEMENT_RECEIVER_ADDRESS: "<your_receiver_address>"
      MIN_DEPOSIT_USDC: "5000000"
      SOFT_MAX_DEPOSIT_USDC: "500000000"
      HARD_MAX_DEPOSIT_USDC: "2000000000"
      LIFI_BASE_URL: "https://li.quest/v1"
      LIFI_TIMEOUT: "4s"
      FUNDING_ALLOWED_CHAIN_IDS: "84532"
      FUNDING_ALLOWED_PROVIDERS: "LIFI"
      # Optional: comma-separated lowercase token addresses
      # FUNDING_ALLOWED_TOKENS: "0x...,0x..."
      DESTINATION_POLL_INTERVAL: "4s"
      MATCHER_POLL_INTERVAL: "2s"
      INDEXER_FINALITY_DEPTH: "3"
      MARKET_ENTRY_SAFETY_BUFFER: "90s"
      # Set before enabling webhook calls from LI.FI
      LIFI_WEBHOOK_SECRET: "<strong_random_secret>"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/healthcheck", "/api/v1/livez"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: migrator
    container_name: retropick-migrator
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}
      RPC_URL: https://sepolia.base.org

  indexer:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: indexer
    container_name: retropick-indexer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}
      RPC_URL: https://sepolia.base.org
      # Current embedded Base Sepolia MarketEngine proxy
      # (apps/backend/internal/registrydata/registry.json) is deployed at block 40608939.
      # Starting from genesis keeps a fresh local DB empty for a long time while the indexer
      # scans tens of millions of empty blocks.
      INDEXER_LOOKBACK_BLOCKS: "500000"
      INDEXER_START_BLOCK: "40608939"
      # Base Sepolia public RPC rejects eth_getLogs ranges above 2,000 blocks.
      INDEXER_MAX_BLOCKS_PER_TICK: "2000"
      # NOTE: config parser treats plain integers as seconds; use a duration string.
      INDEXER_TICK_INTERVAL_MS: "500ms"

  price-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: price-worker
    container_name: retropick-price-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}
      RPC_URL: https://sepolia.base.org
      PRICE_POLL_INTERVAL: "10s"
      PRICE_HEARTBEAT_INTERVAL: "5m"
      DB_MAX_CONNS: "2"
      DB_MIN_CONNS: "1"

  ops:
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: retropick-ops
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/fe-v1/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_REOWN_PROJECT_ID: d2f5d76bb1b000f9443e2172d3a560ba
    container_name: retropick-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
