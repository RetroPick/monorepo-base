services:
  postgres:
    image: postgres:16
    container_name: retropick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retropick
      POSTGRES_PASSWORD: retropick
      POSTGRES_DB: retropick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retropick -d retropick"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: api
    container_name: retropick-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable
      RPC_URL: https://sepolia.base.org
      LIVE_RPC_TIMEOUT: 15s
      LIVE_RPC_GLOBAL_CACHE_TTL: 5s
      DB_MAX_CONNS: "16"
      DB_MIN_CONNS: "2"
      DB_HEALTH_CHECK_INTERVAL: 30s
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/healthcheck", "/api/v1/livez"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: migrator
    container_name: retropick-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable
      RPC_URL: https://sepolia.base.org

  indexer:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: indexer
    container_name: retropick-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable
      RPC_URL: https://sepolia.base.org
      INDEXER_LOOKBACK_BLOCKS: "50000"

  ops:
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: retropick-ops
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/fe-v1/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: retropick-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
