# Default DB URL: postgres:5432 (Compose DNS). For Docker Desktop bridge timeouts, use
# compose.desktop-hairpin.env. extra_hosts defines host.docker.internal where the engine
# does not (Linux Engine / WSL), so hairpin URLs resolve.

services:
  postgres:
    image: postgres:16
    container_name: retropick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retropick
      POSTGRES_PASSWORD: retropick
      POSTGRES_DB: retropick
    # Host 5433 avoids clashing with a local Postgres on 5432. Containers use the
    # service hostname `postgres` on port 5432 (Compose network), not the host publish port.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retropick -d retropick"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: migrator
    container_name: retropick-migrator
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}

  markets-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SERVICE: markets-api
    container_name: retropick-markets-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: ${RETROPICK_COMPOSE_DATABASE_URL:-postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable}
      MARKETS_GAMMA_API_URL: ${MARKETS_GAMMA_API_URL:-https://gamma-api.polymarket.com}
      MARKETS_CLOB_API_URL: ${MARKETS_CLOB_API_URL:-https://clob.polymarket.com}
      DB_MAX_CONNS: "16"
      DB_MIN_CONNS: "2"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/healthcheck", "/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/fe-v1/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_REOWN_PROJECT_ID: d2f5d76bb1b000f9443e2172d3a560ba
    container_name: retropick-web
    restart: unless-stopped
    depends_on:
      markets-api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
