services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: retropick
      POSTGRES_PASSWORD: retropick
      POSTGRES_DB: retropick
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./apps/backend-go
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://retropick:retropick@postgres:5432/retropick?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
