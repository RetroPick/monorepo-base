name: CI

on:
  pull_request:
  push:
    branches: [main, release/demo-rc-v3, production/testnet-hardening-v1]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-gitlinks.sh
      - run: bash scripts/check-gitlinks_test.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/check-markets-openapi-drift.sh
      - run: bash scripts/check-markets-realtime-asyncapi-drift.sh
      - run: pnpm build
      - run: go -C apps/backend build ./...
      - run: go -C apps/backend test ./internal/markets -run 'TestMarketsOpenAPIContainsPhaseOneReadContract|TestOpenAPIRuntimeConformancePhaseOne' -count=1
      - run: go -C apps/backend test ./...
      - run: bash scripts/check-graphify-freshness.sh

  migration-v3:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retropick
          POSTGRES_PASSWORD: retropick
          POSTGRES_DB: retropick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retropick -d retropick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Migration and Markets V1 smoke
        env:
          DATABASE_URL: postgres://retropick:retropick@localhost:5432/retropick?sslmode=disable
        run: |
          go -C apps/backend test ./internal/db/... -run TestMigrationV3 -count=1
          go -C apps/backend test ./internal/markets/postgres -count=1
          go -C apps/backend test ./migrations -run TestMarketsV1Migration -count=1

  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.28.0"
      - name: Check sqlc drift
        run: |
          cd apps/backend
          sqlc generate
          git diff --exit-code internal/dbqueries
