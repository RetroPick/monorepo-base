name: Contracts

on:
  pull_request:
  push:
    branches: [main, release/demo-rc-v3, production/testnet-hardening-v1]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --root package/prediction-v2
      - name: Foundry test (sequential for script env isolation)
        run: FOUNDRY_PROFILE=ci forge test --root package/prediction-v2 -j1
      - run: bash package/prediction-v2/script/check-storage-layout.sh
