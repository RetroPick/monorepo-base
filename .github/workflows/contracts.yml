name: Contracts

on:
  pull_request:
  push:
    branches: [main, release/demo-rc-v3]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --root package/prediction-v2
      - run: forge test --root package/prediction-v2
      - run: forge test --root package/prediction-v2 --match-path "test/treasury/*"
