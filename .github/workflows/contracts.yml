name: Contracts (archived legacy)

on:
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --root archive/archive/contracts/legacy-pool-v1
      - name: Foundry test (sequential for script env isolation)
        run: FOUNDRY_PROFILE=ci forge test --root archive/archive/contracts/legacy-pool-v1 -j1
      - run: bash archive/archive/contracts/legacy-pool-v1/script/check-storage-layout.sh
