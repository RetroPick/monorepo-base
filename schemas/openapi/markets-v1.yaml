openapi: 3.1.0
info:
  title: RetroPick Markets API
  version: 1.3.0
  description: |
    Public, Polymarket-native BFF shared by future web and Android clients.
    Polymarket remains the venue and settlement authority.

    Money representations (no binary floating point):
    - DecimalString — unsigned decimal strings for prices, probabilities, and book sizes (PHASE-1 read).
    - MoneyAmount — integer base units plus currency and decimals for balances, funding, and fees (PHASE-2+).

    PHASE-3 order submit, cancel, and list paths are spec-frozen in this document.
    Runtime handlers remain gated by GET /markets/capabilities features.order_submit until MKT-P3-002 wiring.

    Every upstream-derived response carries provenance and freshness metadata.
servers:
  - url: /api/v1
tags:
  - name: Markets
  - name: Intelligence
  - name: Health
paths:
  /markets/eligibility:
    get:
      tags: [Markets]
      operationId: getMarketsEligibility
      summary: Fail-closed future transactional eligibility state
      x-phase: 1
      responses:
        "200":
          $ref: "#/components/responses/Eligibility"
  /markets/capabilities:
    get:
      tags: [Markets]
      operationId: getMarketsCapabilities
      summary: Build and upstream capability metadata
      x-phase: 1
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
              examples:
                phase2NoSubmit:
                  summary: PHASE-2 default — order submit disabled
                  value:
                    version: "1.3.0"
                    catalog: true
                    trading: false
                    combos: false
                    intelligence: true
                    features:
                      order_submit: false
                      orderbook_read: true
                    source: retropick
                    checkedAt: "2026-08-09T10:00:00Z"
  /markets/me/wallets:
    get:
      tags: [Markets]
      operationId: listMyWallets
      summary: List linked Polymarket account wallets for the authenticated session
      description: |
        Returns the session signer EOA and any linked Polymarket trading wallets
        (proxy, Safe, or Deposit Wallet). signerAddress and accountWallet MUST remain
        distinct fields per ADR-003. Empty wallets means not yet linked — not an error.
      x-phase: 2
      security:
        - MarketsSession: []
      responses:
        "200":
          description: Signer and linked account wallets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletsListResponse"
              examples:
                linkedProxy:
                  summary: Proxy linked — signer differs from account wallet
                  value:
                    schemaVersion: "1"
                    signerAddress: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    wallets:
                      - accountWallet: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                        walletType: GNOSIS_SAFE
                        linkStatus: linked
                        isPrimary: true
                        chainId: 137
                    checkedAt: "2026-08-09T10:00:00Z"
                notLinked:
                  summary: No linked account wallet yet
                  value:
                    schemaVersion: "1"
                    signerAddress: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    wallets: []
                    checkedAt: "2026-08-09T10:00:00Z"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/me/balances:
    get:
      tags: [Markets]
      operationId: listMyBalances
      summary: Read tradable pUSD collateral for the primary account wallet
      description: |
        Returns the session signer's primary linked accountWallet and its tradable pUSD
        collateral balance from the Polymarket CLOB (venue authority). Fixed-point
        MoneyAmount only — never binary floating point. Requires a linked account wallet;
        returns 404 when none is linked yet.
      x-phase: 2
      security:
        - MarketsSession: []
      responses:
        "200":
          description: Primary account wallet collateral balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancesListResponse"
              examples:
                linkedWithCollateral:
                  summary: Linked proxy wallet with tradable pUSD
                  value:
                    schemaVersion: "1"
                    signerAddress: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    accountWallet: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                    collateral:
                      amount: "10500000"
                      currency: pUSD
                      decimals: 6
                    checkedAt: "2026-08-09T10:00:00Z"
                    provenance:
                      source: polymarket_clob
                      upstreamId: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                      observedAt: "2026-08-09T10:00:00Z"
                    freshness:
                      state: fresh
                      observedAt: "2026-08-09T10:00:00Z"
                      ageMillis: 0
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No linked primary account wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                accountNotLinked:
                  summary: Session authenticated but no linked account wallet
                  value:
                    error:
                      code: account_not_linked
                      message: no linked account wallet
        "502":
          description: Venue balance upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/me/orders:
    get:
      tags: [Markets]
      operationId: listMyOrders
      summary: List the authenticated user's order projections
      description: |
        Returns venue-aligned order projections for the session's linked account wallet.
        Use status=open to list resting and in-flight orders (open, partially_filled,
        cancel_pending, unknown). Reconcile with user.orders WebSocket and venue truth.
        Responses MUST NOT be cached (private, no-store).
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrderListStatus"
        - name: marketId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: tokenId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersListResponse"
              examples:
                openOrders:
                  summary: One open buy limit order
                  value:
                    schemaVersion: "1"
                    orders:
                      - orderId: "11111111-1111-4111-8111-111111111111"
                        venueOrderId: "0xabc123"
                        marketId: polymarket:market:456
                        tokenId: token-yes
                        side: BUY
                        price: "0.42"
                        originalSize: "100"
                        filledSize: "0"
                        remainingSize: "100"
                        status: open
                        exchangeDomain: standard
                        createdAt: "2026-08-09T10:05:00Z"
                        updatedAt: "2026-08-09T10:05:00Z"
                    page:
                      nextCursor: null
                      limit: 50
                    checkedAt: "2026-08-09T10:06:00Z"
                    provenance:
                      source: polymarket_clob
                      observedAt: "2026-08-09T10:06:00Z"
                    freshness:
                      state: fresh
                      observedAt: "2026-08-09T10:06:00Z"
                      ageMillis: 0
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No linked primary account wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/me/fills:
    get:
      tags: [Markets]
      operationId: listMyFills
      summary: List the authenticated user's fill projections
      description: |
        Returns venue-aligned fill projections for the session's linked account wallet.
        REST counterpart to the user.fills WebSocket channel. Fees use fixed-point
        MoneyAmount (pUSD). Never invent fills the venue did not produce.
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrderIDQuery"
        - name: marketId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: tokenId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated fill list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillsListResponse"
              examples:
                recentFill:
                  summary: Single partial fill
                  value:
                    schemaVersion: "1"
                    fills:
                      - fillId: "22222222-2222-4222-8222-222222222222"
                        orderId: "11111111-1111-4111-8111-111111111111"
                        venueTradeId: "trade-789"
                        marketId: polymarket:market:456
                        tokenId: token-yes
                        side: BUY
                        price: "0.42"
                        size: "25"
                        fee:
                          amount: "10000"
                          currency: pUSD
                          decimals: 6
                        filledAt: "2026-08-09T10:07:00Z"
                        provenance:
                          source: polymarket_clob
                          upstreamId: trade-789
                          observedAt: "2026-08-09T10:07:00Z"
                    page:
                      nextCursor: null
                      limit: 50
                    checkedAt: "2026-08-09T10:07:30Z"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No linked primary account wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/orders/preview:
    post:
      tags: [Markets]
      operationId: previewOrder
      summary: Preview a limit order before wallet signing
      description: |
        Assembles an unsigned CLOB V2 order payload, binds it to a contentHash, and
        returns human-readable summary metadata for client confirmation. Requires an
        authenticated, eligible session and a makerAddress linked to the session.
        Does not submit to CLOB. Builder attribution is attached server-side only.
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPreviewRequest"
            examples:
              buyLimit:
                summary: Buy limit preview
                value:
                  marketId: polymarket:market:456
                  tokenId: token-yes
                  side: BUY
                  price: "0.42"
                  size: "100"
                  orderType: LIMIT
                  timeInForce: GTC
                  makerAddress: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      responses:
        "200":
          description: Order preview ready for signing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPreviewResponse"
        "400":
          description: Invalid order parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Eligibility denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Market or token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Maker wallet not linked to session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Upstream validation unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/orders/submit:
    post:
      tags: [Markets]
      operationId: submitOrder
      summary: Submit a signed limit order to CLOB V2
      description: |
        Accepts a wallet signature bound to a prior previewId and contentHash. The BFF
        reloads the preview record, recomputes the binding hash, and relays the signed
        order upstream when integrity checks pass. Requires RequireEligible and a linked
        maker. On upstream timeout the response status is unknown — clients MUST poll
        GET /markets/me/orders and MUST NOT auto-resubmit. Gated by features.order_submit.
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSubmitRequest"
            examples:
              signedSubmit:
                summary: Submit after preview + wallet sign
                value:
                  previewId: "33333333-3333-4333-8333-333333333333"
                  contentHash: "0x8ff5b36b12c7cb42f697de3936d80c5fb9e965e46fd05c85d35f822f2e43b1ff"
                  signature: "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef01"
      responses:
        "201":
          description: Order accepted or submitted (venue-dependent status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSubmitResponse"
              examples:
                acceptedOpen:
                  summary: Venue accepted — resting on book
                  value:
                    schemaVersion: "1"
                    orderId: "11111111-1111-4111-8111-111111111111"
                    venueOrderId: "0xabc123"
                    status: open
                    clientOrderId: "client-001"
                    submittedAt: "2026-08-09T10:05:00Z"
                    provenance:
                      source: polymarket_clob
                      upstreamId: "0xabc123"
                      observedAt: "2026-08-09T10:05:00Z"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Eligibility denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Preview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                previewNotFound:
                  value:
                    error:
                      code: preview_not_found
                      message: preview session not found
        "409":
          description: Content hash mismatch — no upstream submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                integrityMismatch:
                  summary: Tampered contentHash
                  value:
                    error:
                      code: integrity_mismatch
                      message: preview content hash does not match stored payload
        "410":
          description: Preview expired — re-preview required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                previewExpired:
                  value:
                    error:
                      code: preview_expired
                      message: preview TTL exceeded
        "422":
          description: Idempotency key replay with different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: CLOB upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Order submit capability disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                capabilityDisabled:
                  value:
                    error:
                      code: capability_disabled
                      message: order_submit is disabled
  /markets/orders/{orderId}/cancel-preview:
    post:
      tags: [Markets]
      operationId: previewCancelOrder
      summary: Preview canceling an open order before wallet signing
      description: |
        Assembles an unsigned CLOB V2 cancel payload for the given orderId, binds it
        to a contentHash, and returns human-readable summary metadata. Does not cancel
        on venue. Same hash envelope rules as order preview (unsignedPayload + metadata).
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Cancel preview ready for signing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCancelPreviewResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Eligibility denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found or not cancelable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Order not owned by session maker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Upstream validation unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/orders/{orderId}/cancel:
    post:
      tags: [Markets]
      operationId: cancelOrder
      summary: Submit a signed cancel to CLOB V2
      description: |
        Accepts a wallet signature bound to a prior cancel previewId and contentHash.
        Same integrity and idempotency rules as submitOrder. Gated by features.order_submit.
      x-phase: 3
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "200":
          description: Cancel accepted or pending venue confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCancelResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Eligibility denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Preview or order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Content hash mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Preview expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Idempotency key replay with different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: CLOB upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Order submit capability disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/me/wallets/link:
    post:
      tags: [Markets]
      operationId: linkExistingWallet
      summary: Connect an existing Polymarket account wallet to the session signer
      description: |
        Persists a connect-existing linkage between the session signer EOA and a
        client-supplied Polymarket trading wallet. The BFF never generates or invents
        accountWallet addresses. Response is a bare LinkedWallet object. Responses
        MUST NOT be cached (private, no-store).
      x-phase: 2
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkExistingWalletRequest"
            examples:
              linkProxy:
                summary: Link existing Gnosis Safe proxy wallet
                value:
                  accountWallet: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                  walletType: GNOSIS_SAFE
                  isPrimary: true
      responses:
        "200":
          description: Linked account wallet persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedWallet"
              examples:
                linkedProxy:
                  summary: Proxy linked — signer differs from account wallet
                  value:
                    accountWallet: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                    walletType: GNOSIS_SAFE
                    linkStatus: linked
                    isPrimary: true
                    chainId: 137
        "400":
          description: Invalid wallet address or malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalidRequest:
                  value:
                    error:
                      code: invalid_request
                      message: invalid wallet address
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Wallet linkage conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                conflict:
                  value:
                    error:
                      code: conflict
                      message: wallet linkage conflict
        "503":
          description: Wallet linking is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                serviceUnavailable:
                  value:
                    error:
                      code: service_unavailable
                      message: wallet linking is not configured
  /markets/account-wallet/preview:
    post:
      tags: [Markets]
      operationId: previewAccountWallet
      summary: Preview metadata for deposit-wallet deploy or link-existing
      description: |
        Returns preview metadata for the requested account-wallet action. Does not
        call upstream relayer HTTP, does not persist linkage, and exposes no relayer
        secrets. When action is omitted, defaults to deploy_deposit_wallet. Responses
        MUST NOT be cached (private, no-store).
      x-phase: 2
      security:
        - MarketsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountWalletPreviewRequest"
            examples:
              deployDepositWallet:
                summary: Preview deposit wallet deploy
                value:
                  action: deploy_deposit_wallet
              emptyBody:
                summary: Default action when body is empty object
                value: {}
      responses:
        "200":
          description: Preview metadata for client confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWalletPreviewResponse"
              examples:
                deployDepositWallet:
                  summary: Deploy Deposit Wallet preview
                  value:
                    schemaVersion: "1"
                    signerAddress: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    action: deploy_deposit_wallet
                    chainId: 137
                    message: Sign and deploy Deposit Wallet via upstream relayer; BFF persists the deployed address on relay.
        "400":
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Wallet linking is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/account-wallet/relay:
    post:
      tags: [Markets]
      operationId: relayAccountWallet
      summary: Persist client-supplied deployed Deposit Wallet address
      description: |
        Persists a deployed Deposit Wallet address supplied by the client after
        upstream relayer deploy. The BFF never generates or invents accountWallet
        addresses. Idempotent upsert at the store layer. Responses MUST NOT be cached
        (private, no-store).
      x-phase: 2
      security:
        - MarketsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountWalletRelayRequest"
            examples:
              relayDepositWallet:
                summary: Persist deployed Deposit Wallet
                value:
                  accountWallet: "0xdddddddddddddddddddddddddddddddddddddddd"
                  isPrimary: true
      responses:
        "200":
          description: Deposit Wallet linkage persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWalletRelayResponse"
              examples:
                relayed:
                  summary: Relay persisted deposit wallet
                  value:
                    schemaVersion: "1"
                    signerAddress: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    wallet:
                      accountWallet: "0xdddddddddddddddddddddddddddddddddddddddd"
                      walletType: DEPOSIT_WALLET
                      linkStatus: linked
                      isPrimary: true
                      chainId: 137
        "400":
          description: Missing or invalid account wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Wallet linkage conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Wallet linking is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /markets/events:
    get:
      tags: [Markets]
      operationId: listMarketsEvents
      summary: List normalized public events
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Event page
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/events/{eventId}:
    get:
      tags: [Markets]
      operationId: getMarketsEvent
      summary: Get an event and its normalized markets
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/markets/{marketId}:
    get:
      tags: [Markets]
      operationId: getMarketsMarket
      summary: Get market detail and resolution provenance
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
      responses:
        "200":
          description: Market detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/markets/{marketId}/orderbook:
    get:
      tags: [Markets]
      operationId: getMarketsOrderBook
      summary: Get an authoritative outcome-token order-book snapshot
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: Order-book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/markets/{marketId}/history:
    get:
      tags: [Markets]
      operationId: getMarketsHistory
      summary: Get sparse public price history without forward filling
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
        - name: interval
          in: query
          schema:
            type: string
            enum: [1h, 6h, 1d, 1w, max]
            default: 1d
        - name: fidelity
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 60
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/markets/{marketId}/health:
    get:
      tags: [Markets]
      operationId: getMarketsMarketHealth
      summary: Get deterministic market-liquidity health components
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: Health components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketHealthSnapshot"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/intelligence/signals:
    get:
      tags: [Intelligence]
      operationId: listMarketsSignals
      summary: List deterministic public signal envelopes
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: marketId
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Signal page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /health/live:
    get:
      tags: [Health]
      operationId: getMarketsLiveness
      summary: Process liveness independent of upstream availability
      x-phase: 1
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getMarketsReadiness
      summary: Ability to safely serve the configured responsibility
      x-phase: 1
      responses:
        "200":
          description: Ready or safely degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Required dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    MarketsSession:
      type: apiKey
      in: cookie
      name: retropick_markets_session
      description: HttpOnly session cookie issued by Markets auth (MKT-P2-005).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventID:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    MarketID:
      name: marketId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TokenID:
      name: tokenId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID for mutating POST idempotency (24h replay window).
      schema:
        type: string
        format: uuid
    OrderID:
      name: orderId
      in: path
      required: true
      description: Internal RetroPick order UUID.
      schema:
        type: string
        format: uuid
    OrderIDQuery:
      name: orderId
      in: query
      description: Filter fills by internal RetroPick order UUID.
      schema:
        type: string
        format: uuid
    OrderListStatus:
      name: status
      in: query
      description: |
        Filter orders by status. Use open for resting and in-flight orders
        (open, partially_filled, cancel_pending, unknown).
      schema:
        $ref: "#/components/schemas/OrderListStatusFilter"
  responses:
    Eligibility:
      description: Eligibility decision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EligibilityResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UpstreamUnavailable:
      description: Upstream unavailable and no bounded stale projection exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DataUnavailable:
      description: Data is unavailable, invalid, stale beyond policy, or resynchronizing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    SchemaVersion:
      type: string
      const: "1"
    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Unsigned decimal string for prices, probabilities, and book sizes. Never use binary floating point.
      examples: ["0.42"]
    MoneyAmount:
      type: object
      additionalProperties: false
      description: Fixed-point money as integer base units. Used for balances, funding, fees, and notional (PHASE-2+). Never use binary floating point.
      required: [amount, currency, decimals]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+$'
          description: Integer base units as string (avoids JS int53 loss; never a decimal fraction).
        currency:
          type: string
          minLength: 1
          maxLength: 16
          examples: ["USDC"]
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          examples: [6]
      examples:
        - amount: "10500000"
          currency: USDC
          decimals: 6
    MarketStatus:
      type: string
      enum: [unknown, open, closed, resolved, archived]
    FreshnessState:
      type: string
      enum: [fresh, stale, resyncing, unavailable, invalid]
    UpstreamProvenance:
      type: object
      additionalProperties: false
      required: [source, observedAt]
      properties:
        source:
          type: string
          enum: [polymarket_gamma, polymarket_clob, polymarket_clob_ws, retropick_projection]
        upstreamId:
          type: string
        observedAt:
          type: string
          format: date-time
        upstreamUpdatedAt:
          type: [string, "null"]
          format: date-time
        contentHash:
          type: string
    MarketFreshness:
      type: object
      additionalProperties: false
      required: [state, observedAt]
      properties:
        state:
          $ref: "#/components/schemas/FreshnessState"
        observedAt:
          type: string
          format: date-time
        ageMillis:
          type: integer
          minimum: 0
        reason:
          type: string
        bookHash:
          type: string
    ResolutionSource:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
    ResolutionRule:
      type: object
      additionalProperties: false
      required: [description, sources, contentHash]
      properties:
        description:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ResolutionSource"
        contentHash:
          type: string
        updatedAt:
          type: [string, "null"]
          format: date-time
    Outcome:
      type: object
      additionalProperties: false
      required: [id, upstreamId, name]
      properties:
        id:
          type: string
          description: Stable RetroPick ID
        upstreamId:
          type: string
          description: Immutable Polymarket token ID
        name:
          type: string
        price:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        winner:
          type: [boolean, "null"]
    MarketCapability:
      type: object
      additionalProperties: false
      required: [orderBook, history, realtime, negRisk, trading]
      properties:
        orderBook:
          type: boolean
        history:
          type: boolean
        realtime:
          type: boolean
        negRisk:
          type: boolean
        trading:
          type: boolean
          const: false
    EventSummary:
      type: object
      required: [schemaVersion, id, upstreamId, title, status, marketCount, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        upstreamId:
          type: string
        slug:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/MarketStatus"
        startAt:
          type: [string, "null"]
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
        marketCount:
          type: integer
          minimum: 0
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          id: polymarket:event:1
          upstreamId: "1"
          slug: conformance-event
          title: Conformance Event
          status: open
          marketCount: 1
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_gamma
            observedAt: "2026-07-30T12:00:00Z"
            contentHash: event-hash
    MarketSummary:
      type: object
      required: [schemaVersion, id, upstreamId, conditionId, question, status, outcomes, capabilities, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        upstreamId:
          type: string
        eventId:
          type: string
          description: Canonical parent event link when nested under EventDetail.markets
        conditionId:
          type: string
        slug:
          type: string
        question:
          type: string
        status:
          $ref: "#/components/schemas/MarketStatus"
        endAt:
          type: [string, "null"]
          format: date-time
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/Outcome"
        capabilities:
          $ref: "#/components/schemas/MarketCapability"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          id: polymarket:market:1
          upstreamId: "1"
          eventId: polymarket:event:1
          conditionId: "0xconformance"
          question: Conformance?
          status: open
          outcomes:
            - id: polymarket:token:1
              upstreamId: token-1
              name: "Yes"
              price: "0.42"
          capabilities:
            orderBook: true
            history: true
            realtime: false
            negRisk: false
            trading: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: retropick_projection
            observedAt: "2026-07-30T12:00:00Z"
            contentHash: market-hash
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [markets]
          properties:
            description:
              type: string
            markets:
              type: array
              items:
                $ref: "#/components/schemas/MarketSummary"
    MarketDetail:
      allOf:
        - $ref: "#/components/schemas/MarketSummary"
        - type: object
          required: [resolution]
          properties:
            eventId:
              type: string
            description:
              type: string
            resolution:
              $ref: "#/components/schemas/ResolutionRule"
    OrderBookLevel:
      type: object
      additionalProperties: false
      required: [price, size]
      properties:
        price:
          $ref: "#/components/schemas/DecimalString"
        size:
          $ref: "#/components/schemas/DecimalString"
    OrderBookSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, conditionId, tokenId, hash, timestamp, bids, asks, minOrderSize, tickSize, negRisk, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        conditionId:
          type: string
        tokenId:
          type: string
        hash:
          type: string
        timestamp:
          type: string
          format: date-time
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        bestBid:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestAsk:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        midpoint:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        spread:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        minOrderSize:
          $ref: "#/components/schemas/DecimalString"
        tickSize:
          $ref: "#/components/schemas/DecimalString"
        negRisk:
          type: boolean
        lastTradePrice:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          conditionId: "0xconformance"
          tokenId: token-1
          hash: hash-1
          timestamp: "2026-07-30T12:00:00Z"
          bids:
            - price: "0.4"
              size: "2"
          asks:
            - price: "0.6"
              size: "3"
          bestBid: "0.4"
          bestAsk: "0.6"
          midpoint: "0.5"
          spread: "0.2"
          minOrderSize: "1"
          tickSize: "0.01"
          negRisk: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    PricePoint:
      type: object
      additionalProperties: false
      required: [timestamp, price, derived, source]
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          $ref: "#/components/schemas/DecimalString"
        derived:
          type: boolean
        source:
          type: string
    PriceHistoryResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, tokenId, points, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        tokenId:
          type: string
        interval:
          type: string
          enum: [1h, 6h, 1d, 1w, max]
          description: Echo of the interval query parameter used for this response.
        fidelity:
          type: integer
          minimum: 1
          maximum: 1440
          description: Echo of the fidelity query parameter used for this response.
        points:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          tokenId: token-1
          interval: 1d
          fidelity: 60
          points:
            - timestamp: "2026-07-30T12:00:00Z"
              price: "0.5"
              derived: false
              source: polymarket_clob
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    MarketHealthSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, algorithm, observedAt, bidDepth, askDepth, snapshotAgeMs, crossed, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        algorithm:
          type: string
        observedAt:
          type: string
          format: date-time
        spread:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestBid:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestAsk:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bidDepth:
          $ref: "#/components/schemas/DecimalString"
        askDepth:
          $ref: "#/components/schemas/DecimalString"
        snapshotAgeMs:
          type: integer
          minimum: 0
        crossed:
          type: boolean
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          algorithm: depth_v1
          observedAt: "2026-07-30T12:00:00Z"
          spread: "0.2"
          bestBid: "0.4"
          bestAsk: "0.6"
          bidDepth: "2"
          askDepth: "3"
          snapshotAgeMs: 100
          crossed: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    SignalEvidence:
      type: object
      additionalProperties: false
      required: [kind, referenceId, observedAt, contentHash]
      properties:
        kind:
          type: string
        referenceId:
          type: string
        observedAt:
          type: string
          format: date-time
        contentHash:
          type: string
    SignalEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, type, marketId, state, ruleVersion, reasonCodes, createdAt, idempotencyKey, evidence]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        type:
          type: string
          enum: [new_market, price_move, liquidity_change, rule_changed]
        marketId:
          type: string
        state:
          type: string
          enum: [observed, processed, confirmed, expired, retracted]
        ruleVersion:
          type: string
        reasonCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        retractedAt:
          type: [string, "null"]
          format: date-time
        idempotencyKey:
          type: string
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SignalEvidence"
    RealtimeEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, source, marketId, upstreamId, tokenId, sequence, streamEpoch, deliveryCounter, observedAt, publishedAt, payload]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        eventId:
          type: string
        eventType:
          type: string
          enum: [hello, subscribed, unsubscribed, orderbook.snapshot, orderbook.delta, trade.executed, market.tick_size_changed, market.updated, signal.created, signal.retracted, resync.required, error]
        source:
          type: string
          const: retropick
        marketId:
          type: string
        upstreamId:
          type: string
        tokenId:
          type: string
        sequence:
          type: "null"
          description: Always null — Polymarket does not document authoritative sequence.
        snapshotHash:
          type: string
        streamEpoch:
          type: integer
          minimum: 0
          description: RetroPick transport epoch; increments on reconnect/resnapshot.
        deliveryCounter:
          type: integer
          minimum: 0
          description: Monotonic within streamEpoch only.
        observedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        payload:
          type: object
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, limit]
      properties:
        nextCursor:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 100
    EventsListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, events, cursor, page, source, checkedAt, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        cursor:
          type: [string, "null"]
        page:
          $ref: "#/components/schemas/PageInfo"
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
    SignalsListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, signals, page]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalEnvelope"
        page:
          $ref: "#/components/schemas/PageInfo"
    EligibilityResponse:
      type: object
      additionalProperties: false
      required: [eligible, checkedAt]
      properties:
        eligible:
          type: boolean
        reason:
          type: string
        checkedAt:
          type: string
          format: date-time
        region:
          type: string
    WalletType:
      type: string
      enum: [EOA, POLY_PROXY, GNOSIS_SAFE, DEPOSIT_WALLET]
      description: Polymarket wallet type per EV-009.
    LinkStatus:
      type: string
      enum: [linked, pending_verification]
    LinkedWallet:
