components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID for idempotent mutation replay within 24h
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Eligibility or capability denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: Polymarket upstream unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DecimalString:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      description: Decimal value as string (prices, probabilities)
      examples:
      - '0.55'
      - '1000.00'
    Money:
      type: object
      required:
      - amount
      - currency
      - decimals
      properties:
        amount:
          type: string
          description: Integer string in base units
          examples:
          - '1000000'
        currency:
          type: string
          examples:
          - USDC
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          examples:
          - 6
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
    EligibilityResponse:
      type: object
      required:
      - eligible
      - checkedAt
      properties:
        eligible:
          type: boolean
        reason:
          type: string
        checkedAt:
          type: string
          format: date-time
        region:
          type: string
    CapabilitiesResponse:
      type: object
      required:
      - version
      - catalog
      - trading
      - combos
      - intelligence
      - checkedAt
      properties:
        version:
          type: string
        catalog:
          type: boolean
        trading:
          type: boolean
        combos:
          type: boolean
        intelligence:
          type: boolean
        features:
          type: object
          additionalProperties:
            type: boolean
        checkedAt:
          type: string
          format: date-time
    EventSummary:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
    EventsListResponse:
      type: object
      required:
      - events
      - source
      - checkedAt
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        cursor:
          type:
          - string
          - 'null'
        stale:
          type: boolean
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
    OrderPreviewRequest:
      type: object
      required:
      - marketId
      - side
      - size
      - price
      properties:
        marketId:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        size:
          $ref: '#/components/schemas/Money'
        price:
          $ref: '#/components/schemas/DecimalString'
    OrderPreviewResponse:
      type: object
      required:
      - previewId
      - payloadHash
      - expiresAt
      properties:
        previewId:
          type: string
        payloadHash:
          type: string
        eip712:
          type: object
        expiresAt:
          type: string
          format: date-time
        estimatedFee:
          $ref: '#/components/schemas/Money'
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
x-phase-definitions:
  '1': Foundation — catalog, eligibility, capabilities
  '2': Account wallet and funding
  '3': Trading core and intelligence
  '4': Portfolio, redemption, withdrawals
security: []
