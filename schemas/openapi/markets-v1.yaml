openapi: 3.1.0
info:
  title: RetroPick Markets API
  version: 1.0.0
  description: 'Polymarket-native BFF consumed by web and Android. Handlers: apps/backend/internal/markets. Status: reviewed
    (Wave 3, 2026-07-25).'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
tags:
- name: policy
  description: Eligibility and capability discovery
- name: catalog
  description: Event and market catalog
- name: trading
  description: Order preview, submit, cancel
- name: wallet
  description: Wallet accounts and approvals
- name: funding
  description: Deposit and withdrawal flows
- name: portfolio
  description: Positions, activity, operations
- name: intelligence
  description: Signals, whales, wallet profiles, market health
- name: alerts
  description: Alert rules and inbox
- name: journal
  description: Trade journal entries
