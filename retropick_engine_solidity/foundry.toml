[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Use: `FOUNDRY_PROFILE=production forge build` — overrides only listed keys vs `[profile.default]`.
[profile.production]
optimizer_runs = 1_000_000

[profile.deploybudget]
optimizer_runs = 80

[profile.ci]
fuzz = { runs = 256 }
