# Golden vectors — P&L / ROI / Win Rate (SM-I-004)
# Observation unit: resolved position/event — not raw fill count.
# Money: BIGINT minor units. Rates: integer bps where noted.

version: roi_v1
feature: SM-I-004
updated: "2026-08-09"

params:
  win_rate_model: beta_binomial_v1
  alpha0: 2
  beta0: 2
  n_min_public_win_rate: 15
  roi_denominator: average_capital_deployed_v1

vectors:
  - id: wallet_perf_001
    version: roi_v1
    feature: SM-I-004
    edge_case: false
    reason: "Single resolved win — realized P&L and raw win rate"
    input:
      wallet_address: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      closed_positions:
        - position_id: "pos_1"
          market_id: "market_demo_1"
          resolved: true
          cost_basis: 1000000000
          proceeds: 1500000000
          won: true
      open_marks: []
    expected:
      realized_pnl: 500000000
      unrealized_pnl: 0
      total_pnl: 500000000
      wins: 1
      losses: 0
      raw_win_rate_bps: 10000
      shrunk_win_rate_bps: 6000   # (2+1)/(4+1) = 0.60
      public_win_rate_display: null  # n < n_min

  - id: wallet_perf_002
    version: roi_v1
    feature: SM-I-004
    edge_case: false
    reason: "Open position contributes unrealized only"
    input:
      wallet_address: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      closed_positions: []
      open_marks:
        - position_id: "pos_open_1"
          cost_basis: 2000000000
          mark_value: 1800000000
    expected:
      realized_pnl: 0
      unrealized_pnl: -200000000
      total_pnl: -200000000
      wins: 0
      losses: 0
      raw_win_rate_bps: null
      shrunk_win_rate_bps: 5000  # prior only

  - id: wallet_perf_003
    version: roi_v1
    feature: SM-I-004
    edge_case: true
    reason: "Many fills in one market count as one resolved observation"
    input:
      wallet_address: "0xcccccccccccccccccccccccccccccccccccccccc"
      closed_positions:
        - position_id: "pos_mkt_2"
          market_id: "market_demo_2"
          resolved: true
          cost_basis: 5000000000
          proceeds: 0
          won: false
          fill_count: 30
    expected:
      wins: 0
      losses: 1
      observations: 1
      raw_win_rate_bps: 0
      ignore_fill_count_for_win_rate: true
