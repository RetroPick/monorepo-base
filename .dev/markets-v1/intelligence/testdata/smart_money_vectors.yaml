# Golden vectors — Smart Money Leaderboard (SM-I-005)
# Score is explanatory, versioned, and never an "insider" label.

version: smart_money_v1
feature: SM-I-005
updated: "2026-08-09"

params:
  n_min: 15
  exclude_below_n_min: true
  components:
    - shrunk_win_rate
    - roi_v1
    - sample_size_factor

vectors:
  - id: smart_money_001
    version: smart_money_v1
    feature: SM-I-005
    edge_case: false
    reason: "Eligible wallet ranks above low-sample peer"
    input:
      board_id: "global_v1"
      wallets:
        - wallet_address: "0xdddddddddddddddddddddddddddddddddddddddd"
          sample_n: 40
          shrunk_win_rate_bps: 6200
          roi_bps: 1800
        - wallet_address: "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
          sample_n: 40
          shrunk_win_rate_bps: 5100
          roi_bps: 200
    expected:
      ranking:
        - wallet_address: "0xdddddddddddddddddddddddddddddddddddddddd"
          rank: 1
        - wallet_address: "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
          rank: 2
      labels_forbidden: ["insider", "smart_money_insider"]

  - id: smart_money_002
    version: smart_money_v1
    feature: SM-I-005
    edge_case: true
    reason: "Below n_min excluded from public board"
    input:
      board_id: "global_v1"
      wallets:
        - wallet_address: "0xffffffffffffffffffffffffffffffffffffffff"
          sample_n: 3
          shrunk_win_rate_bps: 9000
          roi_bps: 5000
    expected:
      ranking: []
      excluded:
        - wallet_address: "0xffffffffffffffffffffffffffffffffffffffff"
          reason_code: "SAMPLE_BELOW_N_MIN"

  - id: smart_money_003
    version: smart_money_v1
    feature: SM-I-005
    edge_case: true
    reason: "Formula version bump reshuffles without rewriting history rows in place"
    input:
      board_id: "global_v1"
      prior_formula_version: smart_money_v1
      next_formula_version: smart_money_v1_1
      wallet_address: "0xdddddddddddddddddddddddddddddddddddddddd"
    expected:
      snapshot_isolation: true
      prior_snapshot_retained: true
      new_snapshot_formula_version: smart_money_v1_1
