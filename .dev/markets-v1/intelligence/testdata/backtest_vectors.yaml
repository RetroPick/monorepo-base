# Quick Backtest golden vectors — Smart Money Intelligence Launch V1
# Authority: 10_QUICK_BACKTEST.md
# Anti-lookahead: fill_ts >= trade_ts; no future resolution at entry.

version: 1
feature: intelligence.backtest
updated: 2026-08-09

defaults:
  window: 30d
  starting_notional_usd: 1000
  copy_amount_usd: 25

vectors:
  - id: backtest_happy_path
    description: Bounded window; follower fills at next price after each trade.
    wallet: "0xbacktest000000000000000000000000000001"
    trades:
      - { ts: "2026-07-01T10:00:00Z", market_id: m1, side: BUY, price: 0.40 }
      - { ts: "2026-07-10T10:00:00Z", market_id: m1, side: SELL, price: 0.55 }
    prices:
      m1:
        - { ts: "2026-07-01T10:00:05Z", mid: 0.41 }
        - { ts: "2026-07-10T10:00:05Z", mid: 0.54 }
    expect:
      trade_count: 2
      return_pct_finite: true
      max_drawdown_pct_finite: true
      degraded_flags: []
      anti_lookahead: true

  - id: backtest_price_gaps
    description: Missing price after trade → skip/degrade with price_gaps.
    wallet: "0xbacktest000000000000000000000000000002"
    trades:
      - { ts: "2026-07-01T10:00:00Z", market_id: m_gap, side: BUY, price: 0.30 }
    prices:
      m_gap: []
    expect:
      trade_count: 0
      degraded_flags: [price_gaps]
      anti_lookahead: true

  - id: backtest_anti_lookahead_fill
    description: Must not use price points before trade timestamp.
    wallet: "0xbacktest000000000000000000000000000003"
    trades:
      - { ts: "2026-07-01T12:00:00Z", market_id: m2, side: BUY, price: 0.50 }
    prices:
      m2:
        - { ts: "2026-07-01T11:59:00Z", mid: 0.20 }  # before trade — forbidden for fill
        - { ts: "2026-07-01T12:00:10Z", mid: 0.52 }
    expect:
      fill_price: 0.52
      forbid_fill_price: 0.20
      anti_lookahead: true
      degraded_flags: []

  - id: backtest_pagination_truncated
    description: Upstream truncation surfaces degraded flag.
    wallet: "0xbacktest000000000000000000000000000004"
    meta:
      pagination_truncated: true
    trades:
      - { ts: "2026-07-01T10:00:00Z", market_id: m3, side: BUY, price: 0.44 }
    prices:
      m3:
        - { ts: "2026-07-01T10:00:05Z", mid: 0.45 }
    expect:
      trade_count: 1
      degraded_flags: [pagination_truncated]

  - id: backtest_no_future_resolution
    description: Resolution known only after entry must not affect entry decision.
    wallet: "0xbacktest000000000000000000000000000005"
    trades:
      - { ts: "2026-07-01T10:00:00Z", market_id: m4, side: BUY, price: 0.48 }
    market_resolution:
      m4: { resolved_at: "2026-07-20T00:00:00Z", outcome: YES }
    prices:
      m4:
        - { ts: "2026-07-01T10:00:05Z", mid: 0.49 }
    expect:
      entry_ignores_resolution: true
      anti_lookahead: true
