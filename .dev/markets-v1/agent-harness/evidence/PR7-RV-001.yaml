id: PR7-RV-001
title: Advisory lock hijack session leak
severity: P1
status: resolved
finding: catalogLease.Release discarded hijacked *pgx.Conn without closing the session
resolution: Close hijacked connection with bounded cleanup context; errors.Join unlock and close errors
tests:
