openapi: 3.1.0
info:
  title: RetroPick Markets API
  version: 1.1.1
  description: |
    Public, Polymarket-native read BFF shared by future web and Android clients.
    Polymarket remains the venue and settlement authority.

    Money representations (no binary floating point):
    - DecimalString — unsigned decimal strings for prices, probabilities, and book sizes (PHASE-1 read).
    - MoneyAmount — integer base units plus currency and decimals for balances, funding, and fees (PHASE-2+).

    Every upstream-derived response carries provenance and freshness metadata.
servers:
  - url: /api/v1
tags:
  - name: Markets
  - name: Intelligence
  - name: Health
paths:
  /markets/eligibility:
    get:
      tags: [Markets]
      operationId: getMarketsEligibility
      summary: Fail-closed future transactional eligibility state
      x-phase: 1
      responses:
        "200":
          $ref: "#/components/responses/Eligibility"
  /markets/capabilities:
    get:
      tags: [Markets]
      operationId: getMarketsCapabilities
      summary: Build and upstream capability metadata
      x-phase: 1
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /markets/events:
    get:
      tags: [Markets]
      operationId: listMarketsEvents
      summary: List normalized public events
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Event page
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/events/{eventId}:
    get:
      tags: [Markets]
      operationId: getMarketsEvent
      summary: Get an event and its normalized markets
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/markets/{marketId}:
    get:
      tags: [Markets]
      operationId: getMarketsMarket
      summary: Get market detail and resolution provenance
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
      responses:
        "200":
          description: Market detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /markets/markets/{marketId}/orderbook:
    get:
      tags: [Markets]
      operationId: getMarketsOrderBook
      summary: Get an authoritative outcome-token order-book snapshot
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: Order-book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/markets/{marketId}/history:
    get:
      tags: [Markets]
      operationId: getMarketsHistory
      summary: Get sparse public price history without forward filling
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
        - name: interval
          in: query
          schema:
            type: string
            enum: [1h, 6h, 1d, 1w, max]
            default: 1d
        - name: fidelity
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 60
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/markets/{marketId}/health:
    get:
      tags: [Markets]
      operationId: getMarketsMarketHealth
      summary: Get deterministic market-liquidity health components
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: Health components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketHealthSnapshot"
        "503":
          $ref: "#/components/responses/DataUnavailable"
  /markets/intelligence/signals:
    get:
      tags: [Intelligence]
      operationId: listMarketsSignals
      summary: List deterministic public signal envelopes
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: marketId
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Signal page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /health/live:
    get:
      tags: [Health]
      operationId: getMarketsLiveness
      summary: Process liveness independent of upstream availability
      x-phase: 1
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getMarketsReadiness
      summary: Ability to safely serve the configured responsibility
      x-phase: 1
      responses:
        "200":
          description: Ready or safely degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Required dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventID:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    MarketID:
      name: marketId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TokenID:
      name: tokenId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    Eligibility:
      description: Eligibility decision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EligibilityResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UpstreamUnavailable:
      description: Upstream unavailable and no bounded stale projection exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DataUnavailable:
      description: Data is unavailable, invalid, stale beyond policy, or resynchronizing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    SchemaVersion:
      type: string
      const: "1"
    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Unsigned decimal string for prices, probabilities, and book sizes. Never use binary floating point.
      examples: ["0.42"]
    MoneyAmount:
      type: object
      additionalProperties: false
      description: Fixed-point money as integer base units. Used for balances, funding, fees, and notional (PHASE-2+). Never use binary floating point.
      required: [amount, currency, decimals]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+$'
          description: Integer base units as string (avoids JS int53 loss; never a decimal fraction).
        currency:
          type: string
          minLength: 1
          maxLength: 16
          examples: ["USDC"]
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          examples: [6]
      examples:
        - amount: "10500000"
          currency: USDC
          decimals: 6
    MarketStatus:
      type: string
      enum: [unknown, open, closed, resolved, archived]
    FreshnessState:
      type: string
      enum: [fresh, stale, resyncing, unavailable, invalid]
    UpstreamProvenance:
      type: object
      additionalProperties: false
      required: [source, observedAt]
      properties:
        source:
          type: string
          enum: [polymarket_gamma, polymarket_clob, polymarket_clob_ws, retropick_projection]
        upstreamId:
          type: string
        observedAt:
          type: string
          format: date-time
        upstreamUpdatedAt:
          type: [string, "null"]
          format: date-time
        contentHash:
          type: string
    MarketFreshness:
      type: object
      additionalProperties: false
      required: [state, observedAt]
      properties:
        state:
          $ref: "#/components/schemas/FreshnessState"
        observedAt:
          type: string
          format: date-time
        ageMillis:
          type: integer
          minimum: 0
        reason:
          type: string
        bookHash:
          type: string
    ResolutionSource:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
    ResolutionRule:
      type: object
      additionalProperties: false
      required: [description, sources, contentHash]
      properties:
        description:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ResolutionSource"
        contentHash:
          type: string
        updatedAt:
          type: [string, "null"]
          format: date-time
    Outcome:
      type: object
      additionalProperties: false
      required: [id, upstreamId, name]
      properties:
        id:
          type: string
          description: Stable RetroPick ID
        upstreamId:
          type: string
          description: Immutable Polymarket token ID
        name:
          type: string
        price:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        winner:
          type: [boolean, "null"]
    MarketCapability:
      type: object
      additionalProperties: false
      required: [orderBook, history, realtime, negRisk, trading]
      properties:
        orderBook:
          type: boolean
        history:
          type: boolean
        realtime:
          type: boolean
        negRisk:
          type: boolean
        trading:
          type: boolean
          const: false
    EventSummary:
      type: object
      required: [schemaVersion, id, upstreamId, title, status, marketCount, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        upstreamId:
          type: string
        slug:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/MarketStatus"
        startAt:
          type: [string, "null"]
          format: date-time
        endAt:
          type: [string, "null"]
          format: date-time
        marketCount:
          type: integer
          minimum: 0
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          id: polymarket:event:1
          upstreamId: "1"
          slug: conformance-event
          title: Conformance Event
          status: open
          marketCount: 1
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_gamma
            observedAt: "2026-07-30T12:00:00Z"
            contentHash: event-hash
    MarketSummary:
      type: object
      required: [schemaVersion, id, upstreamId, conditionId, question, status, outcomes, capabilities, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        upstreamId:
          type: string
        eventId:
          type: string
          description: Canonical parent event link when nested under EventDetail.markets
        conditionId:
          type: string
        slug:
          type: string
        question:
          type: string
        status:
          $ref: "#/components/schemas/MarketStatus"
        endAt:
          type: [string, "null"]
          format: date-time
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/Outcome"
        capabilities:
          $ref: "#/components/schemas/MarketCapability"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          id: polymarket:market:1
          upstreamId: "1"
          eventId: polymarket:event:1
          conditionId: "0xconformance"
          question: Conformance?
          status: open
          outcomes:
            - id: polymarket:token:1
              upstreamId: token-1
              name: "Yes"
              price: "0.42"
          capabilities:
            orderBook: true
            history: true
            realtime: false
            negRisk: false
            trading: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: retropick_projection
            observedAt: "2026-07-30T12:00:00Z"
            contentHash: market-hash
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [markets]
          properties:
            description:
              type: string
            markets:
              type: array
              items:
                $ref: "#/components/schemas/MarketSummary"
    MarketDetail:
      allOf:
        - $ref: "#/components/schemas/MarketSummary"
        - type: object
          required: [resolution]
          properties:
            eventId:
              type: string
            description:
              type: string
            resolution:
              $ref: "#/components/schemas/ResolutionRule"
    OrderBookLevel:
      type: object
      additionalProperties: false
      required: [price, size]
      properties:
        price:
          $ref: "#/components/schemas/DecimalString"
        size:
          $ref: "#/components/schemas/DecimalString"
    OrderBookSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, conditionId, tokenId, hash, timestamp, bids, asks, minOrderSize, tickSize, negRisk, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        conditionId:
          type: string
        tokenId:
          type: string
        hash:
          type: string
        timestamp:
          type: string
          format: date-time
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        bestBid:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestAsk:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        midpoint:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        spread:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        minOrderSize:
          $ref: "#/components/schemas/DecimalString"
        tickSize:
          $ref: "#/components/schemas/DecimalString"
        negRisk:
          type: boolean
        lastTradePrice:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          conditionId: "0xconformance"
          tokenId: token-1
          hash: hash-1
          timestamp: "2026-07-30T12:00:00Z"
          bids:
            - price: "0.4"
              size: "2"
          asks:
            - price: "0.6"
              size: "3"
          bestBid: "0.4"
          bestAsk: "0.6"
          midpoint: "0.5"
          spread: "0.2"
          minOrderSize: "1"
          tickSize: "0.01"
          negRisk: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    PricePoint:
      type: object
      additionalProperties: false
      required: [timestamp, price, derived, source]
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          $ref: "#/components/schemas/DecimalString"
        derived:
          type: boolean
        source:
          type: string
    PriceHistoryResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, tokenId, points, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        tokenId:
          type: string
        interval:
          type: string
          enum: [1h, 6h, 1d, 1w, max]
          description: Echo of the interval query parameter used for this response.
        fidelity:
          type: integer
          minimum: 1
          maximum: 1440
          description: Echo of the fidelity query parameter used for this response.
        points:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          tokenId: token-1
          interval: 1d
          fidelity: 60
          points:
            - timestamp: "2026-07-30T12:00:00Z"
              price: "0.5"
              derived: false
              source: polymarket_clob
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    MarketHealthSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, marketId, algorithm, observedAt, bidDepth, askDepth, snapshotAgeMs, crossed, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        marketId:
          type: string
        algorithm:
          type: string
        observedAt:
          type: string
          format: date-time
        spread:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestBid:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bestAsk:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        bidDepth:
          $ref: "#/components/schemas/DecimalString"
        askDepth:
          $ref: "#/components/schemas/DecimalString"
        snapshotAgeMs:
          type: integer
          minimum: 0
        crossed:
          type: boolean
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
      examples:
        - schemaVersion: "1"
          marketId: polymarket:market:1
          algorithm: depth_v1
          observedAt: "2026-07-30T12:00:00Z"
          spread: "0.2"
          bestBid: "0.4"
          bestAsk: "0.6"
          bidDepth: "2"
          askDepth: "3"
          snapshotAgeMs: 100
          crossed: false
          freshness:
            state: fresh
            observedAt: "2026-07-30T12:00:00Z"
          provenance:
            source: polymarket_clob
            observedAt: "2026-07-30T12:00:00Z"
    SignalEvidence:
      type: object
      additionalProperties: false
      required: [kind, referenceId, observedAt, contentHash]
      properties:
        kind:
          type: string
        referenceId:
          type: string
        observedAt:
          type: string
          format: date-time
        contentHash:
          type: string
    SignalEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, type, marketId, state, ruleVersion, reasonCodes, createdAt, idempotencyKey, evidence]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        id:
          type: string
        type:
          type: string
          enum: [new_market, price_move, liquidity_change, rule_changed]
        marketId:
          type: string
        state:
          type: string
          enum: [observed, processed, confirmed, expired, retracted]
        ruleVersion:
          type: string
        reasonCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        retractedAt:
          type: [string, "null"]
          format: date-time
        idempotencyKey:
          type: string
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SignalEvidence"
    RealtimeEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, source, marketId, upstreamId, tokenId, sequence, streamEpoch, deliveryCounter, observedAt, publishedAt, payload]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        eventId:
          type: string
        eventType:
          type: string
          enum: [hello, subscribed, unsubscribed, orderbook.snapshot, orderbook.delta, trade.executed, market.tick_size_changed, market.updated, signal.created, signal.retracted, resync.required, error]
        source:
          type: string
          const: retropick
        marketId:
          type: string
        upstreamId:
          type: string
        tokenId:
          type: string
        sequence:
          type: "null"
          description: Always null — Polymarket does not document authoritative sequence.
        snapshotHash:
          type: string
        streamEpoch:
          type: integer
          minimum: 0
          description: RetroPick transport epoch; increments on reconnect/resnapshot.
        deliveryCounter:
          type: integer
          minimum: 0
          description: Monotonic within streamEpoch only.
        observedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        payload:
          type: object
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, limit]
      properties:
        nextCursor:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 100
    EventsListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, events, cursor, page, source, checkedAt, freshness, provenance]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        cursor:
          type: [string, "null"]
        page:
          $ref: "#/components/schemas/PageInfo"
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
        freshness:
          $ref: "#/components/schemas/MarketFreshness"
        provenance:
          $ref: "#/components/schemas/UpstreamProvenance"
    SignalsListResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, signals, page]
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalEnvelope"
        page:
          $ref: "#/components/schemas/PageInfo"
    EligibilityResponse:
      type: object
      additionalProperties: false
      required: [eligible, checkedAt]
      properties:
        eligible:
          type: boolean
        reason:
          type: string
        checkedAt:
          type: string
          format: date-time
        region:
          type: string
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [version, catalog, trading, combos, intelligence, source, checkedAt]
      properties:
        version:
          type: string
        catalog:
          type: boolean
        trading:
          type: boolean
          const: false
        combos:
          type: boolean
          const: false
        intelligence:
          type: boolean
        features:
          type: object
          additionalProperties:
            type: boolean
        source:
          type: string
