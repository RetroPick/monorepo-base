parallelization_rules:
  - rule: one_owner_per_writable_path
    description: No two in-progress tasks may share an owned_paths entry
  - rule: phase_sequential_default
    description: Phases run in order unless may_run_in_parallel_with is set
  - rule: contract_first
    description: OpenAPI and migrations precede client integration
  - rule: read_before_write
    description: Catalog read (PHASE-1) precedes wallet/trading (PHASE-2+)

